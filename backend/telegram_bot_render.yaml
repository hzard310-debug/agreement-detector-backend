services:
  - type: web
    name: telegram-bot-sms
    runtime: python
    pythonVersion: 3.11
    buildCommand: python -m pip install --upgrade pip && python -m pip install --no-cache-dir -r telegram_requirements.txt && python -m pip install --no-cache-dir requests==2.31.0
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 telegram_bot:app
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        scope: run
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        scope: run
        sync: false
      - key: KEEP_ALIVE_KEY
        scope: run
        sync: false
      - key: KEEP_ALIVE_URL
        scope: run
        sync: false

