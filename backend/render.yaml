services:
  - type: web
    name: agreement-detector-api
    runtime: python
    pythonVersion: 3.11
    buildCommand: pip install --upgrade pip setuptools wheel && pip install --no-cache-dir -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 app:app
    envVars:
      - key: CLAUDE_API_KEY
        scope: run
        sync: false
