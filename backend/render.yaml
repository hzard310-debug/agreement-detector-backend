services:
  - type: web
    name: agreement-detector-api
    runtime: python
    pythonVersion: "3.11"
    rootDir: .
    buildCommand: find . -name "requirements.txt" && pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 app:app
    envVars:
      - key: CLAUDE_API_KEY
        scope: run
        sync: false
